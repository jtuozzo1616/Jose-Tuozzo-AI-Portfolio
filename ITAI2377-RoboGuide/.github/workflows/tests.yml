name: RoboGuide continuous integration
on:
  push:
    paths: ["ITAI2377-RoboGuide/**"]
  pull_request:
    paths: ["ITAI2377-RoboGuide/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ITAI2377-RoboGuide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m roboguide.evaluation
