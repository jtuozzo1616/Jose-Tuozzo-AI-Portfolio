[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "roboguide-pidog"
version = "0.1.0"
description = "CPU-first evidence-grounded PiDog support assistant"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "pandas>=2.0,<3"]
[project.optional-dependencies]
ui = ["gradio>=4,<7"]
online = ["beautifulsoup4>=4.12,<5", "requests>=2.31,<3"]
test = ["pytest>=7,<10"]
[tool.setuptools.packages.find]
include = ["roboguide*"]
[tool.pytest.ini_options]
testpaths=["tests"]
